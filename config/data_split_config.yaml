# Data configuration parameters for training a PSF model
params:
  train:
    # Directory path to training dataset
    data_dir: /path/to/training/dataset
    # Training dataset filename (only .npy are loaded)
    file: train.npy
    # Field in the dataset representing sources (stars))
    target_field: noisy_stars
  test:
    # Directory path to test dataset
    data_dir: /path/to/validation/data
    # Test dataset filename (currently only .npy files supported)
    file: test.npy
    # Field in the dataset representing sources (stars)
    target_field: stars
  # Define canonical keys for dataset
  # Canonical dataset fields determine dataset size and ensure
  # consistent train/test splitting across arrays.
  # Overrides DEFAULT_CANONICAL_KEYS.
  canonical_keys:
    - sources
    - positions
    - seds

  # Optional dataset fields
  # Uncomment if present in your dataset
  # - masks
  # - zernike_prior
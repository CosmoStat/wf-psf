resources:

  psf_models:
    standard:
      inference_config: inference_standard.yaml
    oversampled:
      inference_config: inference_oversampled.yaml

metrics:

  pixel_mask:
    enabled: true
    params:
      aperture:
        type: circular
        centre: stamp_centre
        radius: 2.6
        unit: sigma

  goodness_of_fit:
    enabled: true
    required_resources:
      - psf_models.standard
    params:
      normalize_residuals: true

  shapes:
    enabled: false
    required_resources:
      - psf_models.oversampled


rejection:

  pixel_mask:
    enabled: true
    diagnostic: aperture_masked_fraction
    policy:
      threshold:
        value: 3.0

  goodness_of_fit:
    enabled: false
    diagnostic: reduced_chi_square
    policy:
      threshold:
        value: 3.0

reporting:

  save_metrics: true
  log_statistics: true
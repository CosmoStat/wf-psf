resources:

  psf_models:
    standard:
      inference_config: inference_standard.yaml
    oversampled:
      inference_config: inference_oversampled.yaml

metrics:

  pixel_mask:
    enabled: false
    params:
      aperture:
        type: circular
        radius: 2.6
        unit: sigma


rejection:

  pixel_mask:
    enabled: true
    policy:
      threshold:
        value: 0.25
